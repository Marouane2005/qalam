name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OCR languages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-ara fonts-dejavu-core
      - name: Install Qalam
        run: pip install -e "./api[dev]"
      - name: Ruff
        working-directory: api
        run: ruff check .
      - name: Mypy
        working-directory: api
        run: mypy --package qalam
      - name: Pytest
        working-directory: api
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: pytest --cov=qalam --cov-report=term-missing --cov-fail-under=75

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f api/Dockerfile --build-arg QALAM_EXTRAS= -t qalam-api:ci .
      - name: Build the web image
        run: docker build -f web/Dockerfile -t qalam-web:ci web

  # Native arm64 builds for Ampere / aarch64 hosts (public-repo free runners).
  docker-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build slim API image
        run: >
          docker build -f api/Dockerfile
          --build-arg QALAM_EXTRAS=
          --build-arg QALAM_PRELOAD_EMBEDDING_MODEL=
          -t qalam-api:ci-arm64-slim .
      - name: Build embeddings API image (skip model preload)
        run: >
          docker build -f api/Dockerfile
          --build-arg QALAM_PRELOAD_EMBEDDING_MODEL=
          -t qalam-api:ci-arm64-embeddings .
      - name: Smoke-import sentence-transformers on arm64
        run: >
          docker run --rm qalam-api:ci-arm64-embeddings
          python -c "import torch; import sentence_transformers; print(torch.__version__, torch.cuda.is_available())"
      - name: Build the web image
        run: docker build -f web/Dockerfile -t qalam-web:ci-arm64 web
