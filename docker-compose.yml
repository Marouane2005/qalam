name: qalam

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qalam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qalam}
      POSTGRES_DB: qalam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalam -d qalam"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    environment:
      QALAM_DATABASE_URL: postgresql+psycopg://qalam:${POSTGRES_PASSWORD:-qalam}@postgres:5432/qalam
      QALAM_REDIS_URL: redis://redis:6379/0
      QALAM_STORAGE_DIR: /var/lib/qalam/uploads
      QALAM_SAMPLES_DIR: /app/samples
    volumes:
      - uploads:/var/lib/qalam/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["celery", "-A", "qalam.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - .env
    environment:
      QALAM_DATABASE_URL: postgresql+psycopg://qalam:${POSTGRES_PASSWORD:-qalam}@postgres:5432/qalam
      QALAM_REDIS_URL: redis://redis:6379/0
      QALAM_STORAGE_DIR: /var/lib/qalam/uploads
      QALAM_SAMPLES_DIR: /app/samples
    volumes:
      - uploads:/var/lib/qalam/uploads
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      QALAM_SITE_ADDRESS: ${QALAM_SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-internal@localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy-data:
  caddy-config:
