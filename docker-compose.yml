name: qalam

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: qalam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qalam}
      POSTGRES_DB: qalam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalam -d qalam"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:a58a2b51fdb121a55861f2586cbde33f174c0f33d5a277b182d52dce45ed9cd4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        QALAM_EXTRAS: ${QALAM_EXTRAS:-embeddings}
        QALAM_PRELOAD_EMBEDDING_MODEL: ${QALAM_PRELOAD_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    env_file:
      - .env
    environment:
      QALAM_DATABASE_URL: postgresql+psycopg://qalam:${POSTGRES_PASSWORD:-qalam}@postgres:5432/qalam
      QALAM_REDIS_URL: redis://redis:6379/0
      QALAM_STORAGE_DIR: /var/lib/qalam/uploads
      QALAM_SAMPLES_DIR: /app/samples
      HF_HOME: /var/lib/qalam/hf-cache
      TRANSFORMERS_CACHE: /var/lib/qalam/hf-cache
      SENTENCE_TRANSFORMERS_HOME: /var/lib/qalam/hf-cache
      HUGGINGFACE_HUB_CACHE: /var/lib/qalam/hf-cache
    volumes:
      - uploads:/var/lib/qalam/uploads
      - hf-cache:/var/lib/qalam/hf-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        QALAM_EXTRAS: ${QALAM_EXTRAS:-embeddings}
        QALAM_PRELOAD_EMBEDDING_MODEL: ${QALAM_PRELOAD_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    command: ["celery", "-A", "qalam.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - .env
    environment:
      QALAM_DATABASE_URL: postgresql+psycopg://qalam:${POSTGRES_PASSWORD:-qalam}@postgres:5432/qalam
      QALAM_REDIS_URL: redis://redis:6379/0
      QALAM_STORAGE_DIR: /var/lib/qalam/uploads
      QALAM_SAMPLES_DIR: /app/samples
      HF_HOME: /var/lib/qalam/hf-cache
      TRANSFORMERS_CACHE: /var/lib/qalam/hf-cache
      SENTENCE_TRANSFORMERS_HOME: /var/lib/qalam/hf-cache
      HUGGINGFACE_HUB_CACHE: /var/lib/qalam/hf-cache
    volumes:
      - uploads:/var/lib/qalam/uploads
      - hf-cache:/var/lib/qalam/hf-cache
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    ports:
      - "80:80"
      - "443:443"
    environment:
      QALAM_SITE_ADDRESS: ${QALAM_SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-internal@localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  hf-cache:
  caddy-data:
  caddy-config:
